<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILIZA LULA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .sombra-dura { box-shadow: 6px 6px 0px 0px #000000; }
        .sombra-dura:hover { box-shadow: 2px 2px 0px 0px #000000; transform: translate(4px, 4px); }
        .sombra-branca { box-shadow: 6px 6px 0px 0px #ffffff; }
        .sombra-branca:hover { box-shadow: 2px 2px 0px 0px #ffffff; transform: translate(4px, 4px); }
        
        .leaflet-popup-content-wrapper { border-radius: 0; background: #000; color: #fff; border: 2px solid #dc2626; }
        .leaflet-popup-tip { background: #000; border: 1px solid #dc2626; }
        
        .leaflet-tile { filter: grayscale(100%) contrast(120%); }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #b91c1c; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; border: 1px solid #b91c1c; }
        ::-webkit-scrollbar-thumb:hover { background: #222; }

        .custom-star-marker { background: transparent; border: none; text-align: center; }
    </style>
</head>
<body class="bg-black min-h-screen flex justify-center text-black m-0 p-0 pb-12">

    <div class="w-full max-w-xl bg-red-700 min-h-screen border-x-4 border-black flex flex-col relative">
        
        <div class="p-6 bg-red-700 border-b-4 border-black flex-shrink-0">
            <h1 class="font-bold text-4xl md:text-5xl tracking-tighter text-white drop-shadow-[3px_3px_0px_#000]">MOBILIZA LULA</h1>
            <p class="text-black font-bold text-base md:text-lg mt-1 bg-white inline-block px-2 border-2 border-black">OCUPE AS RUAS</p>
            
            <div class="flex gap-2 mt-4">
                <button onclick="filtrarHoje()" class="flex-1 bg-yellow-400 text-black text-xs md:text-sm font-bold py-2 border-4 border-black sombra-dura transition-all flex justify-center items-center">
                    HOJE
                </button>
                <button onclick="acharMaisPerto()" class="flex-1 bg-black text-white text-xs md:text-sm font-bold py-2 border-4 border-white sombra-branca transition-all flex justify-center items-center">
                    MAIS PERTO
                </button>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSehaSmqwjprviwo0jjZbc5Hhc9HzU-1EC-kL6xIxEvcwG7bbQ/viewform?usp=publish-editor" target="_blank" class="flex-1 bg-white text-black text-xs md:text-sm font-bold py-2 flex justify-center items-center border-4 border-black sombra-dura transition-all">
                    SUGERIR
                </a>
            </div>

            <button onclick="abrirModalMapa()" class="mt-3 w-full bg-black text-white text-base md:text-lg font-bold py-3 border-4 border-white sombra-branca transition-all flex justify-center items-center">
                VER MAPA GERAL DOS ATOS
            </button>
        </div>

        <div id="filtro-bairro" class="hidden bg-black text-white p-3 text-sm font-bold flex justify-between items-center border-b-4 border-red-700 flex-shrink-0">
            <span id="nome-bairro-selecionado">BAIRRO</span>
            <button onclick="limparFiltro()" class="text-red-500 hover:text-white">LIMPAR [X]</button>
        </div>

        <div id="lista-protestos" class="p-6 space-y-6 bg-red-600 flex-1 mb-4">
            <p class="text-white text-xl text-center">CARREGANDO DADOS...</p>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-black text-white text-[11px] md:text-xs text-center py-2 px-4 border-t-4 border-black z-40">
        SITE FEITO POR <a href="https://instagram.com/william.wpv" target="_blank" class="text-yellow-400 hover:underline">@WILLIAM.WPV</a> NO INSTAGRAM. QUALQUER DICA PODE MANDAR LÁ!
    </div>

    <div id="modal-mapa" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex flex-col">
        <div class="bg-black p-4 border-b-4 border-red-700 flex justify-between items-center">
            <span class="text-white font-bold text-lg">MAPA GERAL DE MOBILIZAÇÃO</span>
            <button onclick="fecharModalMapa()" class="bg-red-700 text-white font-bold px-4 py-2 border-2 border-white hover:bg-white hover:text-black transition-colors">
                FECHAR [X]
            </button>
        </div>
        <div id="map" class="flex-1 w-full bg-gray-200"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=3"></script></body>
</html>
