<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILIZA LULA ★</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        #map { height: 100%; z-index: 10; background-color: #f3f4f6; }
        
        .sombra-dura { box-shadow: 6px 6px 0px 0px #000000; }
        .sombra-dura:hover { box-shadow: 2px 2px 0px 0px #000000; transform: translate(4px, 4px); }
        .sombra-branca { box-shadow: 6px 6px 0px 0px #ffffff; }
        .sombra-branca:hover { box-shadow: 2px 2px 0px 0px #ffffff; transform: translate(4px, 4px); }
        
        .leaflet-popup-content-wrapper { border-radius: 0; background: #000; color: #fff; border: 2px solid #dc2626; }
        .leaflet-popup-tip { background: #000; border: 1px solid #dc2626; }
        
        .leaflet-tile { filter: grayscale(100%) contrast(120%); }

        .custom-star-marker {
            background: transparent;
            border: none;
            text-align: center;
        }
        .estrela-mapa {
            font-size: 28px;
            color: #dc2626; /* Vermelho vivo */
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 3px 0px #000;
            line-height: 1;
            display: block;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #b91c1c; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; }
        ::-webkit-scrollbar-thumb:hover { background: #222; }
    </style>
</head>
<body class="bg-black h-screen flex flex-col md:flex-row overflow-hidden text-black">

    <aside class="w-full md:w-[450px] bg-red-700 border-r-4 border-black flex flex-col h-[50vh] md:h-screen z-20 relative">
        <div class="p-6 bg-red-700 border-b-4 border-black flex-shrink-0">
            <h1 class="font-bold text-5xl tracking-tighter text-white drop-shadow-[3px_3px_0px_#000]">MOBILIZA LULA ★</h1>
            <p class="text-black font-bold text-lg mt-2 bg-white inline-block px-2 border-2 border-black">OCUPE AS RUAS</p>
            
            <div class="flex gap-2 mt-6">
                <button onclick="filtrarHoje()" class="flex-1 bg-yellow-400 text-black text-sm font-bold py-2 border-4 border-black sombra-dura transition-all flex justify-center items-center">
                    HOJE
                </button>
                <button onclick="acharMaisPerto()" class="flex-1 bg-black text-white text-sm font-bold py-2 border-4 border-white sombra-branca transition-all flex justify-center items-center">
                    MAIS PERTO
                </button>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSehaSmqwjprviwo0jjZbc5Hhc9HzU-1EC-kL6xIxEvcwG7bbQ/viewform?usp=publish-editor" target="_blank" class="flex-1 bg-white text-black text-sm font-bold py-2 flex justify-center items-center border-4 border-black sombra-dura transition-all">
                    SUGERIR
                </a>
            </div>
        </div>

        <div id="filtro-bairro" class="hidden bg-black text-white p-3 text-lg font-bold flex justify-between items-center border-b-4 border-red-700 flex-shrink-0">
            <span id="nome-bairro-selecionado">BAIRRO</span>
            <button onclick="limparFiltro()" class="text-red-500 hover:text-white">LIMPAR [X]</button>
        </div>

        <div id="lista-protestos" class="p-6 overflow-y-auto flex-1 min-h-0 space-y-6 bg-red-600">
        </div>

        <div class="bg-black text-white text-xs text-center p-3 border-t-4 border-black flex-shrink-0">
            SITE FEITO POR <a href="https://instagram.com/william.wpv" target="_blank" class="text-yellow-400 hover:underline">@WILLIAM.WPV</a> NO INSTAGRAM. QUALQUER DICA PODE MANDAR LÁ!
        </div>
    </aside>

    <main class="w-full md:flex-1 h-[50vh] md:h-screen relative">
        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
